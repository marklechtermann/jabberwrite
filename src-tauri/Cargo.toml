[package]
name = "jabberwrite"
version = "0.1.0"
description = "Voice-to-text dictation for agentic coding"
authors = ["Mark Lechtermann"]
license = "Apache-2.0"
repository = "https://github.com/marklechtermann/jabberwrite"
edition = "2021"
rust-version = "1.90"

[lib]
name = "jabberwrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
cpal = "0.18"
sherpa-onnx = "2.0.1"
arboard = "3"
enigo = "0.6"
ureq = "3"
sha2 = "0.10"
bzip2 = "0.6"
tar = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
x11rb = { version = "0.13", features = ["xinput"] }
ashpd = { version = "0.13", features = ["remote_desktop", "screencast"] }
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
