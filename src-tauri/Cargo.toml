[package]
name = "jabberwrite"
version = "0.1.0"
description = "Voice-to-text dictation for agentic coding"
authors = ["Mark Lechtermann"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/marklechtermann/jabberwrite"
edition = "2021"
rust-version = "1.90"

[lib]
name = "jabberwrite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
cpal = "0.18"
sherpa-onnx = "2.0.1"
arboard = "3"
enigo = "0.6"
ureq = "3"
sha2 = "0.10"
bzip2 = "0.6"
tar = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xinput"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
