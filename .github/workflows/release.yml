name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      # The updater refuses unsigned updates, so a placeholder key would ship unusable releases (ADR 0005).
      - name: Check updater public key
        shell: bash
        run: |
          if grep -q REPLACE_WITH_PUBLIC_KEY src-tauri/tauri.conf.json; then
            echo "::error::Set the updater public key in src-tauri/tauri.conf.json (see ADR 0005)"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set (see ADR 0005)"
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      # MAJOR.MINOR from Cargo.toml, PATCH = run number (ADR 0004).
      - id: version
        run: |
          base=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "([0-9]+\.[0-9]+)\..*"/\1/')
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - id: release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.VERSION}`,
              target_commitish: context.sha,
              name: `Jabberwrite v${process.env.VERSION}`,
              body: "Unsigned builds. See README for installation notes.",
              draft: true,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libxdo-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # sherpa-onnx-sys downloads its native libs into target/sherpa-onnx-prebuilt, which
      # rust-cache does not keep. A restored build-script fingerprint would skip the download
      # and fail with "could not find native static library sherpa-onnx-c-api", so force a rerun.
      - name: Force sherpa-onnx native lib download
        shell: bash
        run: rm -rf src-tauri/target/*/.fingerprint/sherpa-onnx-sys-* src-tauri/target/*/build/sherpa-onnx-sys-*

      - name: Set version
        shell: bash
        run: perl -pi -e 's/^version = ".*"/version = "${{ needs.create-release.outputs.version }}"/ if $. < 10' src-tauri/Cargo.toml

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JABBERWRITE_RELEASE: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true
          # All matrix jobs merge into one latest.json and can collide; see the check in publish-release.
          retryAttempts: 2

  # Arch package (ADR 0010): repackage the .deb, sign it for the in-app updater and add it to
  # latest.json as linux-x86_64-pacman. Runs after all builds, so latest.json is no longer contended.
  build-arch:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      VERSION: ${{ needs.create-release.outputs.version }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed github-cli jq nodejs npm

      - uses: actions/checkout@v4

      # The release is still a draft, so assets are fetched by ID, not by tag.
      - name: Download .deb and latest.json
        run: |
          fetch() {
            id=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --paginate -q ".[] | select(.name == \"$1\") | .id")
            [ -n "$id" ] || { echo "::error::$1 is missing from the release"; exit 1; }
            gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$id" > "$2"
          }
          fetch "Jabberwrite_${VERSION}_amd64.deb" "packaging/arch/Jabberwrite_${VERSION}_amd64.deb"
          fetch latest.json latest.json

      - name: Build package
        run: |
          # makepkg refuses to run as root; the runtime dependencies are not needed to repackage.
          useradd -m builder
          cp -r packaging/arch /tmp/arch
          cd /tmp/arch
          sha=$(sha256sum "Jabberwrite_${VERSION}_amd64.deb" | cut -d' ' -f1)
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^pkgrel=.*/pkgrel=1/" -e "s/^sha256sums=.*/sha256sums=('$sha')/" PKGBUILD
          chown -R builder .
          runuser -u builder -- makepkg --nodeps --noconfirm
          mv "jabberwrite-${VERSION}-1-x86_64.pkg.tar.zst" "$GITHUB_WORKSPACE/Jabberwrite_${VERSION}_x86_64.pkg.tar.zst"

      - name: Sign package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npx tauri signer sign "Jabberwrite_${VERSION}_x86_64.pkg.tar.zst"

      - name: Upload package and update latest.json
        run: |
          pkg="Jabberwrite_${VERSION}_x86_64.pkg.tar.zst"
          upload() {
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=$1" --input "$1" > /dev/null
          }
          upload "$pkg"
          upload "$pkg.sig"
          jq --arg url "https://github.com/$GH_REPO/releases/download/v$VERSION/$pkg" --rawfile sig "$pkg.sig" \
            '.platforms["linux-x86_64-pacman"] = {url: $url, signature: $sig}' latest.json > latest.new.json
          mv latest.new.json latest.json
          old=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets" --paginate -q '.[] | select(.name == "latest.json") | .id')
          gh api --method DELETE "repos/$GH_REPO/releases/assets/$old"
          upload latest.json

  publish-release:
    needs: [create-release, build, build-arch]
    runs-on: ubuntu-latest
    steps:
      # Concurrent jobs can overwrite each other's entries in latest.json. Never publish an
      # incomplete one: installed apps would silently see no update for the missing platform.
      - uses: actions/github-script@v7
        with:
          script: |
            const release_id = ${{ needs.create-release.outputs.release_id }};
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
              per_page: 100,
            });
            const asset = assets.find((a) => a.name === "latest.json");
            if (!asset) core.setFailed("latest.json is missing from the release");
            else {
              const res = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
                headers: { accept: "application/octet-stream" },
              });
              const platforms = Object.keys(JSON.parse(Buffer.from(res.data).toString()).platforms);
              const missing = ["windows-x86_64", "linux-x86_64", "linux-x86_64-pacman", "darwin-aarch64"].filter((p) => !platforms.includes(p));
              if (missing.length) core.setFailed(`latest.json lacks platforms: ${missing.join(", ")}. Re-run the failed build jobs.`);
            }

      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
